<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1 - Cascading Style Sheets (Tuần 3)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="form-container">
        <form action="#" method="post">
            <!-- Full Name -->
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <div class="name-row">
                    <div class="input-wrapper">
                        <input type="text" name="first_name" placeholder="First" required>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" name="last_name" placeholder="Last" required>
                    </div>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Subject -->
            <div class="form-group">
                <label for="subject">Subject</label>
                <select id="subject" name="subject">
                    <option value="advertise">Advertise</option>
                    <option value="support">Support</option>
                    <option value="feedback">Feedback</option>
                </select>
            </div>

            <!-- Your Message -->
            <div class="form-group">
                <label for="message" class="highlight-label">Your Message *</label>
                <textarea id="message" name="message" required></textarea>
            </div>

            <!-- Submit Button -->
            <div class="form-group" style="margin-bottom: 0;">
                <button type="submit" class="btn-submit">Submit</button>
            </div>
        </form>
    </div>

</body>
</html>
