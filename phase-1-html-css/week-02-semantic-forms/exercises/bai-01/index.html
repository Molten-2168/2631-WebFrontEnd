<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1-Giỏ hàng HTML5</title>
</head>
<body>

    <table border="1" cellpadding="3" cellspacing="0">
        <tr>
            <td>Mã sản phẩm</td>
            <td><input type="text" id="productId"></td>
        </tr>
        <tr>
            <td>Tên sản phẩm</td>
            <td><input type="text" id="productName"></td>
        </tr>
        <tr>
            <td>Số lượng</td>
            <td><input type="number" id="quantity"></td>
        </tr>
        <tr>
            <td>Giá</td>
            <td><input type="number" id="price"></td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="button" value="Thêm giỏ hàng" onclick="addToCart()">
            </td>
        </tr>
    </table>

    <p><strong>Tổng sản phẩm:</strong><span id="totalQuantity">0</span></p>
    <p><strong>Tổng tiền: </strong><span id="totalPrice">0</span></p>

    <script src="script.js"></script>
</body>
</html>
