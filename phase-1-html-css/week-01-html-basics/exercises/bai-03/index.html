<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>

        <label for="color-select">Select Color: </label>
        <input type="color" id="color-select" name="color"><br>

        <label for="date-select">Select Date: </label>
        <input type="date" id="date-select" name="date"><br>

        <label for="datetime">Date & Time: </label>
        <input type="text" id="datetime" name="datetime"><br>

        <label for="localdatetime">Local Date & Time: </label>
        <input type="datetime-local" id="datetimelocal" name="datetimelocal"><br>

        <label for="email">Email Address: </label>
        <input type="email" id="emailaddress" name="emailaddress"><br>

        <label for="month">Select Month: </label>
        <input type="month" id="month" name="month"><br>

        <label for="number">Select Number: </label>
        <input type="number" id="number" name="number"><br>

        <label for="number">Select Number: </label>
        <input type="range" id="number" name="number"><br>

        <label for="search">Search Website: </label>
        <input type="search" id="search" name="search"><br>

        <label for="telenumber">Telephone Number: </label>
        <input type="tel" id="telenumber" name="telenumber"><br>

        <label for="time">Select Time: </label>
        <input type="time" id="time" name="time"><br>

        <label for="website">Website URL: </label>
        <input type="url" id="website" name="website" required><br>

        <label for="week">Select Week: </label>
        <input type="week" id="week" name="week"><br>
    </form>
</body>

</html>
