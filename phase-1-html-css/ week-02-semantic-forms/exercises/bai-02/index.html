<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2 - HTML5 Web Worker</title>
</head>
<body>

    <div>
        <label for="num1">number 1: </label>
        <input type="number" id="num1" value="7"><br>
        <label for="num2">number 2: </label>
        <input type="number" id="num2" value="8">

    <div style="margin-top: 15px;">

        <button type="button" onclick="stopWorker()">Stop Worker</button>
    </div>

    <div style="margin-top: 20px;">
        <strong>Kết quả: </strong><span id="result">Chưa chạy</span>
    </div>

    <script src="main.js"></script>
</body>
</html>
